name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Rekann. Do not include secrets or private workspace data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Go to …\n2. Select …\n3. Observe …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release version or commit SHA when known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant browser, operating system, and deployment details.
